[project]
name = "pgx-analyzer"
version = "2.0.0"
description = "Automated Population Pharmacogenomics Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "streamlit>=1.25.0",
    "plotly>=5.14.0",
    "reportlab>=3.6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
